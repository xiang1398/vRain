name: Apply title number Y-shift patch

on:
  push:
    branches:
      - feature/mogai-applied
    paths:
      - .github/workflows/apply-title-number-yshift.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mogai-applied

      - name: Apply patch
        run: python3 tools/apply_title_number_yshift_patch.py

      - name: Commit patched vrain.pl
        run: |
          if git diff --quiet -- vrain.pl; then
            echo "vrain.pl already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vrain.pl
          git commit -m "Shift chapter numbers upward in page-center title"
          git push origin HEAD:feature/mogai-applied
