name: Apply mogai patch

on:
  push:
    branches:
      - feature/mogai-applied
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mogai-applied
      - name: Apply mogai patch
        run: python3 tools/apply_mogai_patch.py
      - name: Static smoke test
        run: python3 tools/test_mogai_patch.py
      - name: Commit generated vrain.pl
        run: |
          if git diff --quiet -- vrain.pl; then
            echo "vrain.pl already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vrain.pl
          git commit -m "feat: implement one-cell black-white 墨蓋 rendering"
          git push origin HEAD:feature/mogai-applied
