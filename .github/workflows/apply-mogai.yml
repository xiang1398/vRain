name: Apply mogai patch

on:
  push:
    branches:
      - feature/mogai-applied
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mogai-applied

      - name: Apply mogai patch
        run: python3 tools/apply_mogai_patch.py

      - name: Static smoke test
        run: python3 tools/test_mogai_patch.py

      - name: Lunyu converter smoke test
        run: python3 tools/test_lunyu_converter.py

      - name: Generate Lunyu Xueer vRain source
        run: |
          python3 tools/wikisource_lunyu_to_vrain.py -o generated/lunyu_xueer_vrain.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('generated/lunyu_xueer_vrain.txt')
          s = p.read_text(encoding='utf-8')
          lines = [x for x in s.splitlines() if x]
          assert lines[0] == '學而第一'
          assert s.count('{{墨:疏}}') >= 17, 'expected chapter preface + 16 疏 blocks'
          assert s.count('{{墨:注}}') >= 10, 'too few 集解 注 blocks; source parsing likely failed'
          assert len(lines) >= 18, 'expected title, preface, and 16 chapter lines'
          print(f'generated {len(lines)} physical lines, {s.count("{{墨:注}}") } 注 blocks, {s.count("{{墨:疏}}") } 疏 blocks')
          PY

      - name: Commit generated files
        run: |
          if git diff --quiet -- vrain.pl generated/lunyu_xueer_vrain.txt; then
            echo "generated files already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vrain.pl generated/lunyu_xueer_vrain.txt
          git commit -m "feat: refresh one-cell 墨蓋 and 學而 vRain source"
          git push origin HEAD:feature/mogai-applied
